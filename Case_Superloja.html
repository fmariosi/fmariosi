<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Superloja – Painel de vendas (prévia)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --fonte:"DIN","DIN Alternate","DIN Next LT Pro","DIN 2014",Bahnschrift,"Segoe UI",system-ui,sans-serif;
  --amarelo:#D9B300; --amarelo-claro:#E8D166; --azul:#1F3864; --azul-barra:#12239E; --verde:#1AAB40;
  --ink:#252423; --ink-2:#55585C; --ink-3:#7B7F84; --line:#DADCE0; --bg:#FAFAFA; --card:#fff;
  --bad:#C0392B; --good:#1E8E3E;
  --sombra:0 2px 6px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--fonte)}
button,input{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:14px 18px 30px}

/* cabeçalho */
.topo{display:flex;gap:14px;align-items:stretch;margin-bottom:12px;flex-wrap:wrap}
.faixa{flex:1;min-width:260px;background:var(--amarelo);padding:9px 18px;font-size:22px;font-weight:700;text-align:center;letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:13px;
  padding:0 13px;border-radius:8px;cursor:pointer;min-height:34px;white-space:nowrap;flex:none}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn svg{width:15px;height:15px;flex:none}
.linha-filtros{display:flex;gap:12px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.btn:focus-visible,.ms-btn:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* filtros no estilo IBBS: rótulo em cima, lista suspensa simples embaixo */
.filtros{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;flex:1 1 600px;min-width:0}
.campo{position:relative;min-width:0}
.campo .rot{display:block;font-size:13px;color:var(--ink);margin:0 0 3px 2px}
.ms-btn{display:flex;align-items:center;gap:6px;width:100%;background:#fff;border:1px solid #C8C8C8;border-radius:4px;padding:6px 9px;cursor:pointer;text-align:left;min-height:34px}
.ms-btn:hover{border-color:#8A8A8A}
.ms-btn[aria-expanded="true"]{border-color:var(--azul)}
.ms-btn .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn svg{width:13px;height:13px;flex:none;color:var(--ink-2)}
.ms-panel{position:absolute;top:calc(100% + 3px);left:0;min-width:100%;width:max-content;max-width:380px;background:#fff;border:1px solid #C8C8C8;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.2);padding:6px;z-index:30;display:none}
.ms-panel.open{display:block}
.campo:nth-child(n+5) .ms-panel{left:auto;right:0}
.ms-search{width:100%;border:1px solid #C8C8C8;border-radius:4px;padding:5px 8px;margin-bottom:5px}
.ms-list{max-height:270px;overflow:auto}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:pointer;border-radius:3px}
.ms-opt:hover{background:#F0F0F0}
.ms-opt input{accent-color:#000;width:15px;height:15px;margin:0;flex:none}
.ms-nota{padding:6px;color:var(--ink-3);font-size:12.5px}
.ms-limpar{border:0;background:none;color:var(--azul);font-weight:700;cursor:pointer;padding:4px 6px;font-size:12.5px}

/* cartões no estilo IBBS: número em cima, rótulo em negrito embaixo, sombra */
.cartoes{display:grid;grid-template-columns:1.25fr repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cartao{background:var(--card);box-shadow:var(--sombra);padding:12px 10px 11px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:86px}
.cartao .valor{font-size:30px;line-height:1.1;color:var(--azul);letter-spacing:.4px;white-space:nowrap}
.cartao .rotulo{font-size:13.5px;font-weight:700;margin-top:5px}
.cartao.var .valor{font-size:21px}

/* gráficos: brancos com faixa de título amarela */
.graficos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.graf{background:var(--card);box-shadow:var(--sombra);min-width:0}
.graf h2{margin:0;background:var(--amarelo-claro);padding:8px 14px;font-size:17px;font-weight:700}
.graf .sub{margin:0;padding:5px 14px 0;font-size:12.5px;color:var(--ink-3)}
.caixa{position:relative;height:300px;padding:6px 12px 10px}
.semchart{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);text-align:center}
.nota{margin-top:16px;font-size:12px;color:var(--ink-3)}

@media (max-width:1100px){.filtros{grid-template-columns:repeat(3,minmax(0,1fr))}.cartoes{grid-template-columns:repeat(2,minmax(0,1fr))}.cartao.var{grid-column:1/-1}.campo:nth-child(n+5) .ms-panel{left:0;right:auto}}
@media (max-width:760px){.graficos{grid-template-columns:minmax(0,1fr)}.filtros{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

  panel.addEventListener("click", e => e.stopPropagation());
  inp.addEventListener("input", () => { ms.busca = norm(inp.value); ms.desenhar(); });
  list.addEventListener("change", e => { e.target.checked ? state[k].add(e.target.value) : state[k].delete(e.target.value); aplicar(); });
  campo.querySelector(".ms-limpar").addEventListener("click", () => { state[k].clear(); aplicar(); });
});
function fecharTodos(){ Object.values(MS).forEach(m => m.fechar()); }
document.addEventListener("click", fecharTodos);
document.addEventListener("keydown", e => { if(e.key==="Escape") fecharTodos(); });
$("#limpar").addEventListener("click", () => { CAMPOS.forEach(([k]) => state[k].clear()); aplicar(); });

/* ============ GRÁFICOS ============ */
const charts = {}, temChart = typeof Chart !== "undefined";
const rotulos = { id:"rotulos", afterDatasetsDraw(c){
  const ctx = c.ctx;
  c.data.datasets.forEach((ds,di) => { if(!ds.rotular || c.getDatasetMeta(di).hidden) return;
    c.getDatasetMeta(di).data.forEach((el,i) => { const v=ds.data[i]; if(v==null) return;
      ctx.save(); ctx.font="600 11.5px "+Chart.defaults.font.family; ctx.fillStyle="#55585C"; ctx.textBaseline="middle";
      ctx.textAlign = v<0 ? "right" : "left"; ctx.fillText(ds.rotular(v), el.x+(v<0?-6:6), el.y); ctx.restore(); }); });
}};
const centro = { id:"centro", afterDraw(c){
  if(c.config.type!=="doughnut") return;
  const a=c.chartArea, ctx=c.ctx; ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
  const dd=c.data.datasets[0].data, tt=dd.reduce((x,y)=>x+y,0);
  if(tt>0){ ctx.font="700 12.5px "+Chart.defaults.font.family; ctx.fillStyle="#fff";
    c.getDatasetMeta(0).data.forEach((el,i) => { const s=dd[i]/tt; if(s<0.045) return;
      const ang=(el.startAngle+el.endAngle)/2, rr=(el.innerRadius+el.outerRadius)/2;
      ctx.fillText(num(s*100,1)+"%", el.x+Math.cos(ang)*rr, el.y+Math.sin(ang)*rr); }); }
  ctx.font="400 24px "+Chart.defaults.font.family; ctx.fillStyle="#1F3864"; ctx.fillText(c.$centro||"", (a.left+a.right)/2, (a.top+a.bottom)/2); ctx.restore();
}};
function iniciar(){
  if(!temChart){ document.querySelectorAll(".caixa").forEach(b => b.innerHTML='<div class="semchart">Gráficos indisponíveis: a biblioteca Chart.js não carregou.<br>Conecte à internet e reabra o arquivo.</div>'); return; }
  Chart.register(rotulos, centro);
  Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue("--fonte").trim();
  Chart.defaults.font.size = 12; Chart.defaults.color = "#55585C"; Chart.defaults.animation.duration = 250;
  const tip = { backgroundColor:"#252423", padding:9, cornerRadius:4, displayColors:false };
  const grade = { color:"#ECECEC" };
  charts.tend = new Chart($("#cTend"), { type:"line",
    data:{ labels:[], datasets:[{ label:"Total Vendas", data:[], borderColor:"#12239E", backgroundColor:"rgba(18,35,158,.38)", fill:true, borderWidth:2, tension:.35, pointRadius:0, pointHoverRadius:5, pointHitRadius:12 }]},
    options:{ maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{display:false}, tooltip:{...tip, callbacks:{ label:c => "Total Vendas: "+abrev(c.parsed.y,true) }}},
      scales:{ x:{grid:{display:false}, ticks:{maxTicksLimit:8, maxRotation:0}}, y:{beginAtZero:true, grid:grade, border:{display:false}, ticks:{callback:v=>curto(v), maxTicksLimit:5}} } } });
  charts.cat = new Chart($("#cCat"), { type:"bar",
    data:{ labels:[], datasets:[
      { label:"Lucro total", data:[], backgroundColor:"#1AAB40", borderRadius:3, maxBarThickness:13, rotular:curto },
      { label:"Total Vendas", data:[], backgroundColor:"#12239E", borderRadius:3, maxBarThickness:13, rotular:curto } ]},
    options:{ indexAxis:"y", maintainAspectRatio:false, layout:{padding:{right:74}},
      plugins:{ legend:{position:"bottom",align:"start",labels:{usePointStyle:true,pointStyle:"circle",boxWidth:7,boxHeight:7}}, tooltip:{...tip, callbacks:{ label:c => c.dataset.label+": "+abrev(c.parsed.x,true) }}},
      scales:{ x:{grid:grade, border:{display:false}, ticks:{callback:v=>curto(v), maxTicksLimit:6}}, y:{grid:{display:false}} } } });
  charts.seg = new Chart($("#cSeg"), { type:"doughnut",
    data:{ labels:[], datasets:[{ data:[], backgroundColor:[], borderColor:"#fff", borderWidth:2 }]},
    options:{ maintainAspectRatio:false, cutout:"70%", layout:{padding:10},
      plugins:{ legend:{position:"right",labels:{usePointStyle:true,pointStyle:"circle",boxWidth:7,boxHeight:7,padding:12,
          generateLabels:ch => { const d=ch.data.datasets[0].data, t=d.reduce((x,y)=>x+y,0);
            return Chart.overrides.doughnut.plugins.legend.labels.generateLabels(ch).map((l,i) => ({...l,
              text:l.text+"  ·  "+((ch.$real||[])[i]<0 ? "prejuízo" : t ? num(100*d[i]/t,1)+"%" : "–")})); } }},
        tooltip:{...tip, callbacks:{ label:c => { const t=c.dataset.data.reduce((a,b)=>a+b,0); return abrev(charts.seg.$real[c.dataIndex],true)+(t ? " ("+num(100*c.parsed/t,2)+"%)" : ""); } }}} } });
  charts.cid = new Chart($("#cCid"), { type:"bar",
    data:{ labels:[], datasets:[{ label:"Total Vendas", data:[], backgroundColor:"#12239E", borderRadius:3, maxBarThickness:13, rotular:curto }]},
    options:{ indexAxis:"y", maintainAspectRatio:false, layout:{padding:{right:74}},
      plugins:{ legend:{display:false}, tooltip:{...tip, callbacks:{ label:c => "Total Vendas: "+abrev(c.parsed.x,true) }}},
      scales:{ x:{display:false, beginAtZero:true}, y:{grid:{display:false}, ticks:{autoSkip:false, font:{weight:"600"}}} } } });
}
const COR_SEG = { "Varejo":"#E66C37", "Grande Empresa":"#12239E", "Pequenas e Medias Empresas":"#118DFF" };

/* ============ APLICAR FILTROS ============ */
function aplicar(){
  // listas de cada filtro: só valores que existem com os outros filtros aplicados (mais os já marcados)
  CAMPOS.forEach(([k]) => {
    const s = new Set(); for(const r of R) if(passa(r,k)) s.add(r[k]);
    for(const v of state[k]) s.add(v);
    MS[k].opts = [...s].sort((a,b) => a.localeCompare(b,"pt-BR",{numeric:true})); MS[k].desenhar();
  });
  const F = R.filter(r => passa(r));
  const vendas = soma(F,r=>r.v), lucro = soma(F,r=>r.l), qtd = soma(F,r=>r.q), pedidos = new Set(F.map(r=>r.ped)).size;
  $("#kVendas").textContent = F.length ? abrev(vendas,true) : "–";
  $("#kQtd").textContent = F.length ? abrev(qtd,false) : "–";
  $("#kLucro").textContent = F.length ? abrev(lucro,true) : "–";
  $("#kTicket").textContent = pedidos ? abrev(vendas/pedidos,true) : "–";

  // Variação AA: só com um único ano escolhido; compara com o ano anterior nos mesmos filtros
  const kv = $("#kVar"); let txt = "Selecione um ano", cor = "#55585C";
  if(state.ano.size===1){
    const ant = String(+[...state.ano][0]-1), va = soma(R.filter(r => r.ano===ant && passa(r,"ano")), r=>r.v);
    if(!va) txt = "Sem ano anterior";
    else { const d=(vendas-va)/va; txt = (d>=0?"▲ ":"▼ ")+num(Math.abs(d)*100,1)+"% vs. ano anterior"; cor = d>=0 ? "#1E8E3E" : "#C0392B"; }
  }
  kv.textContent = txt; kv.style.color = cor;

  const cid = [...grupo(F,r=>r.cid,r=>r.v).entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  $("#tCid").textContent = "Top 10 cidades" + (cid.length ? " | Líder: "+cid[0][0] : "");
  $("#nota").textContent = "Prévia em HTML da Página 1 do treino superloja.pbix, com os dados da aba Compras de Exemplo-Superloja.xlsx ("+num(R.length,0)+" linhas; "+num(F.length,0)+" no filtro atual).";
  if(!temChart) return;

  const tm = grupo(F,r=>r.ym,r=>r.v), yms = [...tm.keys()].sort((a,b)=>a-b);
  charts.tend.data.labels = yms.map(y => MESES[y%100-1]+" "+Math.floor(y/100));
  charts.tend.data.datasets[0].data = yms.map(y => tm.get(y)); charts.tend.update();

  const cv = grupo(F,r=>r.cat,r=>r.v), cl = grupo(F,r=>r.cat,r=>r.l), cats = [...cv.keys()].sort((a,b)=>cv.get(a)-cv.get(b));
  charts.cat.data.labels = cats; charts.cat.data.datasets[0].data = cats.map(c=>cl.get(c)); charts.cat.data.datasets[1].data = cats.map(c=>cv.get(c)); charts.cat.update();

  // rosca não representa valores negativos: segmento com prejuízo entra com fatia zero e o valor real fica no balão
  const sl = grupo(F,r=>r.seg,r=>r.l), segs = [...sl.keys()].sort((a,b)=>sl.get(b)-sl.get(a));
  charts.seg.$real = segs.map(s=>sl.get(s)); charts.seg.$centro = F.length ? abrev(lucro,true).replace("R$ ","") : "";
  charts.seg.data.labels = segs; charts.seg.data.datasets[0].data = segs.map(s=>Math.max(0,sl.get(s)));
  charts.seg.data.datasets[0].backgroundColor = segs.map(s=>COR_SEG[s]||"#8C8F8E"); charts.seg.update();

  charts.cid.data.labels = cid.map(c=>c[0]); charts.cid.data.datasets[0].data = cid.map(c=>c[1]); charts.cid.update();
}
iniciar(); aplicar();
</script>
